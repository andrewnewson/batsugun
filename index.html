<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pokémon Type Matchups</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Type Matchup Reference</h1>
      <p class="subtitle">Select 1 or 2 defending types to calculate incoming damage multipliers.</p>
    </header>

    <section class="selection-card">
      <div class="active-types-display">
        <span class="label">Defending as:</span>
        <div id="activePills" class="active-pills-row">
          <span class="placeholder">Select a type below...</span>
        </div>
        <button id="resetBtn" class="reset-btn" type="button" aria-label="Reset selection">Clear</button>
      </div>

      <div id="typeGrid" class="type-button-grid" role="group" aria-label="Pokémon Types"></div>
    </section>

    <main id="matchupResults" class="matchup-results" aria-live="polite">
      <!-- Calculated tiers populate here -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
