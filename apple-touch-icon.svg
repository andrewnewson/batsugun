<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="180" height="180">
  <defs>
    <!-- Dark App Canvas Background -->
    <radialGradient id="bgCanvas" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>

    <!-- Fire Facet Gradient -->
    <linearGradient id="fireGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Water Facet Gradient -->
    <linearGradient id="waterGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Grass Facet Gradient -->
    <linearGradient id="grassGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Drop Shadow for the Emblem -->
    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Opaque Background -->
  <rect width="512" height="512" fill="url(#bgCanvas)" />

  <!-- Shield Group -->
  <g filter="url(#emblemShadow)" transform="translate(0, 4)">
    <!-- Outer Border / Plate -->
    <polygon points="256,60 416,152 416,336 256,428 96,336 96,152" 
             fill="#0f172a" 
             stroke="#334155" 
             stroke-width="12" 
             stroke-linejoin="round" />

    <!-- Top-Left Facet: Fire -->
    <polygon points="256,84 116,165 116,256 256,256" 
             fill="url(#fireGrad)" 
             opacity="0.95" />

    <!-- Top-Right Facet: Water -->
    <polygon points="256,84 396,165 396,256 256,256" 
             fill="url(#waterGrad)" 
             opacity="0.95" />

    <!-- Bottom-Left Facet: Grass -->
    <polygon points="116,256 116,327 256,408 256,256" 
             fill="url(#grassGrad)" 
             opacity="0.92" />

    <!-- Bottom-Right Facet: Ground / Forest Accent -->
    <polygon points="396,256 396,327 256,408 256,256" 
             fill="#047857" 
             opacity="0.9" />

    <!-- Internal Facet Creases -->
    <line x1="256" y1="84" x2="256" y2="408" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <line x1="116" y1="256" x2="396" y2="256" stroke="#0f172a" stroke-width="8" stroke-linecap="round" />
    <line x1="116" y1="165" x2="396" y2="327" stroke="#0f172a" stroke-width="4" opacity="0.4" />
    <line x1="116" y1="327" x2="396" y2="165" stroke="#0f172a" stroke-width="4" opacity="0.4" />

    <!-- Central Core -->
    <circle cx="256" cy="256" r="26" fill="#0f172a" stroke="#f8fafc" stroke-width="6" />
    <polygon points="256,242 266,256 256,270 246,256" fill="#38bdf8" />
  </g>
</svg>
